<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>高校奖助学金 · 申请、初审与学院复核</title>
  <link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar"><div class="brand">学工服务<span>奖助学金管理</span></div><div id="identity">本地教学演示</div></header>
  <main>
    <section class="hero"><p class="eyebrow">SPRINT 01–02 · 申请、初审与学院复核</p><h1>让每一步申请，有据可循。</h1><p>查看通知，准备材料，提交申请，完成辅导员初审与学院复核。所有账号、通知及业务规则均为教学样例。</p></section>
    <div id="message" class="message hidden" role="status" aria-live="polite"></div>
    <section id="loginPanel" class="panel narrow"><h2>进入演示工作台</h2><p>选择预置账号；密码统一为 <code>demo123</code>。</p>
      <form id="loginForm"><label>演示账号<select id="username"><option value="student1">学生1 · 计算机学院</option><option value="student2">学生2 · 同辅导员</option><option value="student3">学生3 · 文学院</option><option value="counselor1">辅导员1 · 计算机学院</option><option value="counselor2">辅导员2 · 文学院</option><option value="college1">学院审核员1 · 计算机学院</option><option value="college2">学院审核员2 · 文学院</option></select></label><label>演示密码<input id="password" type="password" value="demo123" required autocomplete="current-password"></label><button type="submit">进入工作台</button></form>
    </section>
    <section id="workspace" class="hidden">
      <nav><button id="notificationsTab" class="tab active">项目通知</button><button id="applicationsTab" class="tab">我的申请</button><button id="logout" class="ghost">退出 / 切换账号</button></nav>
      <div id="notificationsView"><div class="section-heading"><h2>奖助学金通知</h2><span>截止时间以服务端为准，截止时刻不可提交</span></div><div id="projects" class="cards"></div><section id="projectDetail" class="panel hidden"></section></div>
      <div id="applicationsView" class="hidden"><div class="section-heading"><h2 id="applicationsHeading">我的申请</h2><button id="refreshApps" class="ghost">刷新状态</button></div><div id="applications"></div><section id="applicationDetail" class="panel hidden"></section></div>
    </section>
    <footer>本Sprint范围：通知 → 完整申请 → 辅导员初审 → 学院复核。学院复核通过后进入“待公示”；公示与最终结果（US05 / US06）不在本次实现范围。</footer>
  </main>
</body></html>
